<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HyprGrok</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="shell enter">
    <div id="missingBanner" class="banner hidden" role="alert"></div>

    <header class="top">
      <div class="brand">
        <div class="logo" aria-hidden="true">✦</div>
        <div>
          <h1>HyprGrok</h1>
          <p class="tagline">Grok Build, made for Hyprland</p>
        </div>
      </div>
      <div class="status-pill" id="statusPill" title="Status">…</div>
    </header>

    <nav class="tabs" role="tablist">
      <button type="button" class="tab active" data-tab="ask" role="tab">Ask</button>
      <button type="button" class="tab" data-tab="sessions" role="tab">Sessions</button>
      <button type="button" class="tab" data-tab="history" role="tab">History</button>
    </nav>

    <section class="tab-panel active" id="panel-ask">
      <section class="context-card" id="contextCard">
        <div class="context-head">
          <span>Desktop context</span>
          <button type="button" class="ghost" id="refreshContext" title="Refresh">↻</button>
        </div>
        <div class="context-body" id="contextBody">
          <div class="muted">Loading…</div>
        </div>
      </section>

      <section class="prompt-card">
        <label class="sr-only" for="prompt">Prompt</label>
        <textarea
          id="prompt"
          rows="5"
          placeholder="Ask Grok Build anything…&#10;Ctrl+Enter to send"
          autofocus
        ></textarea>
        <div class="row options">
          <label class="check">
            <input type="checkbox" id="injectContext" />
            <span>Add desktop context</span>
          </label>
          <label class="check">
            <input type="checkbox" id="includeShot" />
            <span>Screenshot</span>
          </label>
        </div>
        <div class="row actions">
          <button type="button" class="primary" id="sendBtn">
            <span class="btn-label">Send to Grok</span>
            <span class="spinner hidden" id="sendSpinner"></span>
          </button>
          <button type="button" class="secondary" id="sessionBtn">Full session</button>
        </div>
        <div class="row actions secondary-actions">
          <button type="button" class="secondary wide" id="askWindowBtn">Ask about current window</button>
        </div>
      </section>

      <section class="response-card">
        <div class="response-head">
          <span>Response</span>
          <button type="button" class="ghost" id="clearResponse" title="Clear">Clear</button>
        </div>
        <pre id="response" class="response-body muted">Send a prompt or open a full Grok Build session.</pre>
      </section>
    </section>

    <section class="tab-panel" id="panel-sessions">
      <div class="list-card">
        <div class="list-head">
          <span>Sessions</span>
          <button type="button" class="ghost" id="refreshSessions">↻</button>
        </div>
        <div id="sessionsList" class="list-body muted">Loading…</div>
      </div>
    </section>

    <section class="tab-panel" id="panel-history">
      <div class="list-card">
        <div class="list-head">
          <span>Recent prompts</span>
          <button type="button" class="ghost" id="refreshHistory">↻</button>
        </div>
        <div id="historyList" class="list-body muted">Loading…</div>
      </div>
    </section>

    <footer class="foot">
      <span id="cwdLabel" class="muted"></span>
      <span class="muted">official <code>grok</code> · v<span id="verLabel">0.2</span></span>
    </footer>
  </div>

  <div id="toast" class="toast hidden" role="status"></div>
  <script src="/app.js"></script>
</body>
</html>
