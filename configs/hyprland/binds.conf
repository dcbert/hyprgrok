# BEGIN HYPRGROK
# HyprGrok keybinds — safe to remove this whole block on uninstall
# Default: Super+G toggles the glass panel

# Prefer PATH; install.sh may rewrite to an absolute path
# Super+Space toggles panel (Super+G often used by shell overlays)
bind = SUPER, SPACE, exec, hyprgrok toggle
bind = SUPER SHIFT, G, exec, hyprgrok session
bind = SUPER ALT, G, exec, hyprgrok context
bind = SUPER CTRL, G, exec, hyprgrok ask-window

# END HYPRGROK
