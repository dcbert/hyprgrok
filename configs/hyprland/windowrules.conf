# BEGIN HYPRGROK
# HyprGrok window rules — marked for clean uninstall
# Glass companion panel (Chrome/Chromium --app window title is "HyprGrok")

windowrulev2 = float, title:^(HyprGrok)$
windowrulev2 = pin, title:^(HyprGrok)$
# Fixed width; height ~88% — avoid window_w race that pushes the panel off-screen
windowrulev2 = size 560 88%, title:^(HyprGrok)$
windowrulev2 = move 100%-576 48, title:^(HyprGrok)$
windowrulev2 = opacity 0.96 override 0.96 override, title:^(HyprGrok)$
windowrulev2 = animation slide right, title:^(HyprGrok)$
windowrulev2 = noblur, title:^(HyprGrok)$

# Optional: full Grok Build terminal sessions launched with class hyprgrok-session
windowrulev2 = float, class:^(hyprgrok-session)$
windowrulev2 = size 70% 75%, class:^(hyprgrok-session)$
windowrulev2 = center, class:^(hyprgrok-session)$

# END HYPRGROK
