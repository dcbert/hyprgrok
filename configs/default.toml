# HyprGrok default configuration (v0.3)
# Copied to ~/.config/hyprgrok/config.toml on first install.
# HyprGrok never stores xAI API keys — authentication stays with official Grok Build.

grok_binary = "grok"
notify_on_complete = true

[panel]
position = "right"          # left | right
width = 560
height = 980
opacity = 0.92
port = 8765
auto_inject_context = false
browser = "auto"            # auto | google-chrome-stable | chromium | firefox

[launch]
terminal = "auto"
preferred_terminals = ["kitty", "foot", "alacritty", "wezterm", "ghostty", "konsole", "gnome-terminal"]
headless_timeout_sec = 300

[keybinds]
# Hyprland conf syntax (mod, key)
# Super+G is often taken by Illogical Impulse shell overlay — Super+Space is the default.
toggle_panel = "SUPER, SPACE"
open_session = "SUPER SHIFT, G"
quick_context = "SUPER ALT, G"

[theme]
accent = "#7aa2f7"
background = "rgba(20, 22, 30, 0.72)"
text = "#c0caf5"
muted = "#565f89"
success = "#9ece6a"
error = "#f7768e"
border = "rgba(122, 162, 247, 0.35)"
font_family = "Inter, JetBrains Mono, ui-sans-serif, system-ui, sans-serif"
